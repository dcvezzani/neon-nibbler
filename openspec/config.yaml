schema: spec-driven

context: |
  Neon Nibbler is an ORIGINAL arcade maze-chase game in the genre of classic
  dot-eating maze games. It must not reuse any existing game's name, characters,
  character names, sprites, maze layouts, sounds or music. Genre mechanics
  (grid maze, pellets, power-ups, enemy behaviour modes) are fine; the
  presentation (player shape, enemy designs/names, maze layout, palette) is ours.
  MOBILE FIRST: design for phone touchscreens (iOS Safari, Android Chrome) in
  portrait first; desktop keyboard play is a secondary target that must still work.
  Stack: HTML5 Canvas + vanilla JavaScript (ES modules), no build step and no
  runtime dependencies; must run from any static server (HTTPS for install).
  Audio is synthesized with the Web Audio API (no audio asset files).
  Game logic (maze, movement, enemy AI, scoring, timers) must be deterministic
  and testable headlessly in Node without a DOM.

